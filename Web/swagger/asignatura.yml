components:
  schemas:
    Asignatura:
      type: object
      required:
        - nombre
      properties:
        clave_asignatura:
          type: integer
          readOnly: true
          description: Clave de la asignatura (generada automáticamente)
          example: 1
        nombre:
          type: string
          maxLength: 50
          description: Nombre de la asignatura (único)
          example: "Bases de Datos"

paths:
  /asignatura:
    get:
      summary: Obtener todas las asignaturas
      description: Retorna la lista completa de asignaturas registradas en el sistema
      tags:
        - Asignaturas
      responses:
        "200":
          description: Lista de asignaturas obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asignatura"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"

    post:
      summary: Crear una nueva asignatura
      description: Registra una nueva asignatura en el sistema
      tags:
        - Asignaturas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Asignatura"
      responses:
        "201":
          description: Asignatura creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  asignatura:
                    $ref: "#/components/schemas/Asignatura"
        "400":
          description: Datos incompletos o inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Bad request, clave or nombre not found"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"

  /asignatura/{clave_asignatura}:
    delete:
      summary: Eliminar una asignatura por clave
      description: Elimina el registro de una asignatura del sistema usando su clave
      tags:
        - Asignaturas
      parameters:
        - name: clave_asignatura
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "204":
          description: Asignatura eliminada exitosamente
        "404":
          description: Asignatura no encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Asignatura not found"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"

    put:
      summary: Actualizar una asignatura por clave
      description: Actualiza los datos de una asignatura existente usando su clave
      tags:
        - Asignaturas
      parameters:
        - name: clave_asignatura
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Asignatura"
      responses:
        "200":
          description: Asignatura actualizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Updated successfully"
        "404":
          description: Asignatura no encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Not found"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"