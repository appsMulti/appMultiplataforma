components:
  schemas:
    Profesor:
      type: object
      required:
        - nombre
        - apellido_paterno
        - apellido_materno
        - curp
        - rfc
        - telefono
        - sexo
        - correo_electronico
        - fecha_nacimiento
        - sueldo
        - all_data_professor
      properties:
        id_profesor:
          type: integer
          description: Clave primaria autogenerada por el controlador de base de datos 
          readOnly: true
          example: 1
        nombre:
          type: string
          maxLength: 25
          example: "María"
        apellido_paterno:
          type: string
          maxLength: 25
          example: "Martínez"
        apellido_materno:
          type: string
          maxLength: 25
          example: "Pérez"
        curp:
          type: string
          minLength: 18
          maxLength: 18
          example: "MAPM700101MDFXXX00"
        rfc:
          type: string
          minLength: 13
          maxLength: 13
          example: "MAPM700101XX3"
        telefono:
          type: string
          minLength: 10
          maxLength: 10
          example: "5559876543"
        sexo:
          type: string
          enum: [M, F]
          example: "F"
        correo_electronico:
          type: string
          format: email
          maxLength: 100
          example: "maria_L@gmail.com"
        fecha_nacimiento:
          type: string
          format: date
          example: "1980-05-15"
        sueldo:
          type: number
          format: decimal
          minimum: 0
          example: 15000.00
        all_data_professor:
          type: object
          example: {}

paths:
  /profesor:
    get:
      summary: Obtener todos los profesores
      tags:
        - Profesores
      responses:
        "200":
          description: Lista de profesores obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profesor"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"

    post:
      summary: Crear un nuevo profesor
      tags:
        - Profesores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profesor"
      responses:
        "201":
          description: Profesor creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profesor"
        "400":
          description: Datos incompletos o inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Bad request"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"

  /profesor/{id_profesor}:
    delete:
      summary: Eliminar un profesor por ID
      tags:
        - Profesores
      parameters:
        - name: id_profesor
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "204":
          description: Profesor eliminado exitosamente
        "404":
          description: Profesor no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Profesor not found"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"

    put:
      summary: Actualizar un profesor por ID
      tags:
        - Profesores
      parameters:
        - name: id_profesor
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profesor"
      responses:
        "200":
          description: Profesor actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Updated successfully"
        "404":
          description: Profesor no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Not found"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"